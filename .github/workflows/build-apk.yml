name: Build Android APK (Offline Artifact)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Install dependencies
        run: npm install

      - name: Build web bundle & sync Capacitor Android
        run: npm run cap:sync

      - name: Build Signed Release & Debug APKs
        working-directory: android
        run: |
          rm -f local.properties
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexDropzone-Offline-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexDropzone-Offline-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
